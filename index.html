      --accent2:#15803d;
      --dark:#0f172a;
      --light:#f8fafc;
    }

    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      font-family:'Inter',sans-serif;
      background:var(--light);
      color:var(--dark);
      user-select:none;
    }

    .navbar{
      width:100%;
      padding:15px 5%;
      background:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow:0 4px 10px rgba(0,0,0,0.08);
      position:sticky;
      top:0;
      z-index:100;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:1.3rem;
      font-weight:800;
      color:var(--accent);
    }

    .logo img{
      width:42px;height:42px;border-radius:50%;
    }

    .btn{
      background:var(--accent);
      color:white;
      text-decoration:none;
      padding:9px 16px;
      border-radius:10px;
      font-size:0.85rem;
      font-weight:700;
    }

    .banner{
      background:linear-gradient(135deg,#16a34a,#22c55e);
      color:white;
      text-align:center;
      padding:60px 20px;
      border-radius:0 0 35px 35px;
    }

    .container{
      max-width:1200px;
      margin:auto;
      padding:40px 5%;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:25px;
    }

    .card{
      background:white;
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 5px 18px rgba(0,0,0,0.08);
    }

    .card img{
      width:100%;
      height:180px;
      object-fit:cover;
    }

    .card-content{
      padding:18px;
      text-align:center;
    }

    .study-btn{
      background:var(--accent);
      color:white;
      padding:12px 22px;
      border-radius:12px;
      font-weight:700;
      border:none;
      cursor:pointer;
    }

    .footer-box{
      margin:40px 5%;
      padding:25px;
      border-radius:22px;
      background:linear-gradient(135deg,#166534,#15803d);
      color:white;
      text-align:center;
    }
  </style>
</head>
