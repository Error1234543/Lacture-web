<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mission 100 NEET Gujarati 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    /* ── VARIABLES ── */
    :root {
      --bg: #0d0f1a;
      --bg2: #13172b;
      --bg3: #1a1f38;
      --border: rgba(255,255,255,0.07);
      --text: #e8ecf8;
      --text-muted: #7a82a8;
      --accent-physics: #38bdf8;
      --accent-chemistry: #f472b6;
      --accent-botany: #4ade80;
      --accent-zoology: #fb923c;
      --accent-notices: #a78bfa;
      --accent: #38bdf8;
      --radius: 14px;
      --transition: 0.2s ease;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Baloo 2','Noto Sans Gujarati',sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    input { -webkit-user-select: text; user-select: text; }

    /* ── HEADER ── */
    header {
      background: linear-gradient(135deg,#0d0f1a 0%,#1a1040 100%);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .header-inner {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      height: 64px;
      gap: 16px;
    }
    .back-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      transition: all var(--transition);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .back-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

    .logo { display:flex; align-items:center; gap:12px; flex:1; }
    .logo-icon { font-size:26px; filter:drop-shadow(0 0 10px rgba(56,189,248,0.5)); }
    .logo-title {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(90deg,#38bdf8,#818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }
    .logo-sub { font-size:10px; color:var(--text-muted); font-weight:600; letter-spacing:1px; text-transform:uppercase; }

    .header-stats { display:flex; gap:16px; }
    .stat-pill {
      display:flex; align-items:center; gap:6px;
      background:var(--bg3); border:1px solid var(--border);
      padding:5px 12px; border-radius:999px; font-size:12px; font-weight:600;
    }

    /* ── SUBJECT NAV ── */
    .subject-nav {
      display:flex; background:var(--bg2);
      border-bottom:1px solid var(--border);
      padding:0 24px; overflow-x:auto; scrollbar-width:none;
      justify-content:center;
    }
    .subject-nav::-webkit-scrollbar { display:none; }
    .subject-btn {
      display:flex; align-items:center; gap:8px;
      padding:0 22px; height:50px; background:none; border:none;
      cursor:pointer; font-family:inherit; font-size:14px; font-weight:700;
      color:var(--text-muted); border-bottom:3px solid transparent;
      transition:all var(--transition); white-space:nowrap;
    }
    .subject-btn:hover { color:var(--text); background:rgba(255,255,255,0.03); }
    .subject-btn.active { color:var(--subject-color); border-bottom-color:var(--subject-color); }
    .subject-btn .s-emoji { font-size:17px; }
    .subject-btn .s-count {
      font-size:11px; font-weight:600;
      background:rgba(255,255,255,0.08); padding:2px 6px; border-radius:999px;
    }

    /* ── SEARCH ── */
    .search-wrap { padding:20px 24px 0; max-width:1300px; margin:0 auto; }
    .search-box {
      display:flex; align-items:center;
      background:var(--bg2); border:1px solid var(--border);
      border-radius:999px; padding:0 20px; gap:10px;
      transition:border-color var(--transition),box-shadow var(--transition);
    }
    .search-box:focus-within {
      border-color:rgba(56,189,248,0.4);
      box-shadow:0 0 0 3px rgba(56,189,248,0.08);
    }
    .search-icon { font-size:17px; opacity:0.5; }
    .search-box input {
      flex:1; background:none; border:none; outline:none;
      font-family:inherit; font-size:14px; color:var(--text); padding:13px 0;
    }
    .search-box input::placeholder { color:var(--text-muted); }
    .clear-btn {
      background:none; border:none; color:var(--text-muted);
      cursor:pointer; font-size:15px; padding:4px; border-radius:50%;
      transition:color var(--transition);
    }
    .clear-btn:hover { color:var(--text); }

    /* ── MAIN ── */
    main { max-width:1300px; margin:0 auto; padding:24px; }

    .loading-screen {
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; padding:80px; gap:16px; color:var(--text-muted);
    }
    .loader {
      width:40px; height:40px;
      border:3px solid var(--bg3); border-top-color:var(--accent);
      border-radius:50%; animation:spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    .subject-header {
      display:flex; align-items:center; gap:14px;
      margin-bottom:24px; animation:fadeUp 0.4s ease both;
    }
    .subject-header-icon {
      width:52px; height:52px; border-radius:14px;
      display:flex; align-items:center; justify-content:center; font-size:26px;
    }
    .subject-header-text h2 { font-size:22px; font-weight:800; }
    .subject-header-text p { font-size:13px; color:var(--text-muted); margin-top:2px; }

    .chapters-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:16px;
    }
    .chapter-card {
      background:var(--bg2); border:1px solid var(--border);
      border-radius:var(--radius); padding:20px; cursor:pointer;
      transition:transform var(--transition),border-color var(--transition),box-shadow var(--transition);
      animation:fadeUp 0.35s ease both; position:relative; overflow:hidden;
      -webkit-touch-callout:none;
    }
    .chapter-card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:3px;
      background:var(--subject-color,var(--accent)); opacity:0;
      transition:opacity var(--transition);
    }
    .chapter-card:hover { transform:translateY(-3px); border-color:rgba(255,255,255,0.14); box-shadow:0 12px 40px rgba(0,0,0,0.3); }
    .chapter-card:hover::before { opacity:1; }
    .chapter-name { font-size:15px; font-weight:700; margin-bottom:14px; line-height:1.3; }
    .chapter-badges { display:flex; flex-wrap:wrap; gap:8px; }
    .badge {
      display:flex; align-items:center; gap:5px;
      padding:5px 11px; border-radius:8px; font-size:12px; font-weight:600;
      background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.07);
      transition:background var(--transition);
    }
    .badge:hover { background:rgba(255,255,255,0.1); }
    .badge.videos  { color:#38bdf8; }
    .badge.notes   { color:#4ade80; }
    .badge.dpp     { color:#fb923c; }
    .badge.empty   { opacity:0.3; }

    .search-subject-label {
      font-size:11px; font-weight:700; text-transform:uppercase;
      letter-spacing:1.5px; color:var(--text-muted);
      margin:20px 0 10px; display:flex; align-items:center; gap:8px;
    }
    .search-subject-label::after { content:''; flex:1; height:1px; background:var(--border); }
    .no-results { text-align:center; padding:60px; color:var(--text-muted); font-size:16px; }

    /* ── CHAPTER MODAL ── */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.7);
      z-index:200; display:flex; align-items:center; justify-content:center;
      padding:20px; backdrop-filter:blur(4px); animation:fadeIn 0.2s ease;
    }
    .modal {
      background:var(--bg2); border:1px solid rgba(255,255,255,0.1);
      border-radius:20px; width:100%; max-width:700px; max-height:85vh;
      display:flex; flex-direction:column;
      animation:slideUp 0.25s ease; box-shadow:0 40px 80px rgba(0,0,0,0.5);
    }
    .modal-header {
      display:flex; align-items:flex-start; justify-content:space-between;
      padding:22px 22px 14px; border-bottom:1px solid var(--border); gap:16px;
    }
    .modal-header h2 { font-size:17px; font-weight:800; line-height:1.3; }
    .modal-close {
      background:var(--bg3); border:1px solid var(--border); color:var(--text-muted);
      width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:14px;
      flex-shrink:0; transition:all var(--transition);
      display:flex; align-items:center; justify-content:center; font-family:inherit;
    }
    .modal-close:hover { color:var(--text); }
    .modal-tabs {
      display:flex; gap:4px; padding:10px 22px;
      border-bottom:1px solid var(--border); background:var(--bg);
      overflow-x:auto; scrollbar-width:none;
    }
    .modal-tabs::-webkit-scrollbar { display:none; }
    .modal-tab {
      padding:7px 14px; border-radius:8px; background:none; border:none;
      font-family:inherit; font-size:12px; font-weight:700; color:var(--text-muted);
      cursor:pointer; transition:all var(--transition);
      display:flex; align-items:center; gap:5px; white-space:nowrap;
    }
    .modal-tab:hover { background:var(--bg3); color:var(--text); }
    .modal-tab.active { background:var(--tab-color,var(--accent)); color:#000; }
    .modal-tab .tab-count {
      background:rgba(0,0,0,0.2); padding:1px 6px; border-radius:999px; font-size:10px;
    }
    .modal-body {
      overflow-y:auto; flex:1; padding:18px 22px;
      scrollbar-width:thin; scrollbar-color:var(--bg3) transparent;
    }
    .modal-body::-webkit-scrollbar { width:6px; }
    .modal-body::-webkit-scrollbar-thumb { background:var(--bg3); border-radius:3px; }

    .resource-list { display:flex; flex-direction:column; gap:8px; }
    .resource-item {
      display:flex; align-items:center; gap:12px;
      padding:12px 16px; background:var(--bg3);
      border:1px solid var(--border); border-radius:10px;
      color:var(--text); transition:all var(--transition);
      font-size:13px; font-weight:500; line-height:1.4;
      cursor:pointer; -webkit-touch-callout:none;
    }
    .resource-item:hover { background:rgba(255,255,255,0.06); border-color:rgba(255,255,255,0.12); transform:translateX(4px); }
    .resource-item .r-num {
      font-size:11px; font-weight:700; color:var(--text-muted);
      min-width:24px; text-align:center; background:var(--bg2);
      padding:3px 6px; border-radius:5px; flex-shrink:0;
    }
    .resource-item .r-icon { font-size:18px; flex-shrink:0; }
    .resource-item .r-title { flex:1; }
    .resource-item .r-open { font-size:15px; opacity:0.4; transition:opacity var(--transition); flex-shrink:0; }
    .resource-item:hover .r-open { opacity:1; }
    .empty-tab { text-align:center; padding:40px; color:var(--text-muted); font-size:14px; }

    /* ── VIDEO PLAYER ── */
    .player-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.92);
      z-index:300; display:flex; align-items:center; justify-content:center;
      padding:16px; backdrop-filter:blur(8px); animation:fadeIn 0.2s ease;
    }
    .player-container {
      width:100%; max-width:960px; background:#0a0c18;
      border:1px solid rgba(255,255,255,0.1); border-radius:18px;
      overflow:hidden; box-shadow:0 40px 100px rgba(0,0,0,0.8);
      animation:slideUp 0.25s ease; display:flex; flex-direction:column;
    }
    .player-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:13px 18px; background:var(--bg2);
      border-bottom:1px solid var(--border); gap:12px;
    }
    .player-title { font-size:13px; font-weight:700; color:var(--text); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .player-close {
      background:var(--bg3); border:1px solid var(--border); color:var(--text-muted);
      width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:14px;
      flex-shrink:0; transition:all var(--transition);
      display:flex; align-items:center; justify-content:center; font-family:inherit;
    }
    .player-close:hover { color:var(--text); }
    .player-frame-wrap { position:relative; width:100%; padding-bottom:56.25%; background:#000; }
    .player-frame-wrap iframe { position:absolute; inset:0; width:100%; height:100%; border:none; }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    @keyframes slideUp { from{opacity:0;transform:translateY(30px) scale(0.97)} to{opacity:1;transform:translateY(0) scale(1)} }

    /* ── RESPONSIVE ── */
    @media(max-width:600px){
      .header-stats { display:none; }
      .subject-btn { padding:0 12px; font-size:13px; }
      .chapters-grid { grid-template-columns:1fr; }
      .modal { max-height:95vh; border-radius:16px 16px 0 0; align-self:flex-end; }
      .modal-overlay { align-items:flex-end; padding:0; }
      .player-container { border-radius:14px 14px 0 0; align-self:flex-end; }
      .player-overlay { align-items:flex-end; padding:0; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <a href="../index.html" class="back-btn">← Back</a>
      <div class="logo">
        <span class="logo-icon">🎯</span>
        <div>
          <div class="logo-title" id="batchTitle">Mission 100 NEET</div>
          <div class="logo-sub">Gujarati 2026</div>
        </div>
      </div>
      <div class="header-stats" id="headerStats"></div>
    </div>
  </header>

  <!-- SUBJECT TABS -->
  <nav class="subject-nav" id="subjectNav"></nav>

  <!-- SEARCH -->
  <div class="search-wrap">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Chapter શોધો..." autocomplete="off"/>
      <button class="clear-btn" id="clearSearch" style="display:none">✕</button>
    </div>
  </div>

  <!-- MAIN -->
  <main id="mainContent">
    <div class="loading-screen" id="loadingScreen">
      <div class="loader"></div>
      <p>Content લોડ થઈ રહ્યો છે...</p>
    </div>
  </main>

  <!-- CHAPTER MODAL -->
  <div class="modal-overlay" id="modalOverlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle"></h2>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-tabs" id="modalTabs"></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- VIDEO PLAYER -->
  <div class="player-overlay" id="videoPlayerModal" style="display:none">
    <div class="player-container">
      <div class="player-header">
        <span class="player-title" id="playerTitle"></span>
        <button class="player-close" id="playerClose">✕</button>
      </div>
      <div class="player-frame-wrap">
        <iframe id="playerIframe" src="about:blank" frameborder="0"
          allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
          referrerpolicy="no-referrer"></iframe>
      </div>
    </div>
  </div>

  <script>
  // ── CONFIG ─────────────────────────────
  // Sirf yahan change karo nayi batch ke liye:
  const BATCH_CONFIG = {
    jsonFile:  'mission.json',          // is folder ka JSON
    title:     'Mission 100 NEET',
    subtitle:  'Gujarati 2026',
    icon:      '🎯',
  };

  const SUBJECTS = {
    Physics:   { emoji:'⚡',  color:'var(--accent-physics)',   bg:'rgba(56,189,248,0.1)' },
    Chemistry: { emoji:'🧪',  color:'var(--accent-chemistry)', bg:'rgba(244,114,182,0.1)' },
    Botany:    { emoji:'🌿',  color:'var(--accent-botany)',    bg:'rgba(74,222,128,0.1)' },
    Zoology:   { emoji:'🐾',  color:'var(--accent-zoology)',   bg:'rgba(251,146,60,0.1)' },
    Notices:   { emoji:'📢',  color:'var(--accent-notices)',   bg:'rgba(167,139,250,0.1)' },
  };

  const TAB_CONFIG = [
    { key:'videos',    label:'Videos',     emoji:'▶️',  color:'#38bdf8' },
    { key:'notes',     label:'Notes',      emoji:'📄',  color:'#4ade80' },
    { key:'dppNotes',  label:'DPP Notes',  emoji:'📝',  color:'#fb923c' },
    { key:'dppVideos', label:'DPP Videos', emoji:'🎥',  color:'#a78bfa' },
  ];

  let allData = {};
  let activeSubject = 'Physics';
  let activeModalTab = 'videos';
  let searchTimer = null;

  // ── URL PROTECTION ──────────────────────
  function encodeURL(url) {
    if (!url) return '';
    return btoa(encodeURIComponent(url));
  }
  function decodeURL(enc) {
    if (!enc) return '';
    try { return decodeURIComponent(atob(enc)); } catch { return ''; }
  }

  // ── ANTI LEAK ───────────────────────────
  function setupAntiLeak() {
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('selectstart', e => { if(e.target.tagName !== 'INPUT') e.preventDefault(); });
    document.addEventListener('dragstart',   e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey && ['u','s','U','S'].includes(e.key)) || e.key === 'F12') e.preventDefault();
    });
  }

  // ── INIT ────────────────────────────────
  async function init() {
    setupAntiLeak();

    // Apply batch config to header
    document.getElementById('batchTitle').textContent = BATCH_CONFIG.title;
    document.querySelector('.logo-sub').textContent    = BATCH_CONFIG.subtitle;
    document.querySelector('.logo-icon').textContent   = BATCH_CONFIG.icon;
    document.title = BATCH_CONFIG.title + ' | ' + BATCH_CONFIG.subtitle;

    try {
      const res = await fetch(BATCH_CONFIG.jsonFile);
      allData = await res.json();
      buildStats();
      buildSubjectNav();
      renderSubject(activeSubject);
      setupSearch();
      setupModal();
      setupVideoPlayer();
      document.getElementById('loadingScreen')?.remove();
    } catch(e) {
      document.getElementById('loadingScreen').innerHTML =
        `<p style="color:#f87171">❌ ${BATCH_CONFIG.jsonFile} લોડ ન થઈ શક્યો.</p>`;
    }
  }

  // ── STATS ───────────────────────────────
  function buildStats() {
    let totalChapters = 0, totalResources = 0;
    Object.values(allData).forEach(chapters => {
      totalChapters += chapters.length;
      chapters.forEach(ch => {
        totalResources += ch.videos.length + ch.notes.length + ch.dppNotes.length + ch.dppVideos.length;
      });
    });
    document.getElementById('headerStats').innerHTML = `
      <div class="stat-pill"><span>📚</span>${totalChapters} Chapters</div>
      <div class="stat-pill"><span>🔗</span>${totalResources}+ Resources</div>
    `;
  }

  // ── SUBJECT NAV ─────────────────────────
  function buildSubjectNav() {
    const nav = document.getElementById('subjectNav');
    nav.innerHTML = '';
    Object.entries(SUBJECTS).forEach(([name, cfg]) => {
      if (!allData[name]) return; // skip subjects not in this batch's JSON
      const chapters = allData[name] || [];
      const btn = document.createElement('button');
      btn.className = 'subject-btn' + (name === activeSubject ? ' active' : '');
      btn.style.setProperty('--subject-color', cfg.color);
      btn.innerHTML = `<span class="s-emoji">${cfg.emoji}</span>${name}<span class="s-count">${chapters.length}</span>`;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.subject-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeSubject = name;
        clearSearch();
        renderSubject(name);
      });
      nav.appendChild(btn);
    });
    // Auto-select first available subject
    const firstAvailable = Object.keys(SUBJECTS).find(s => allData[s]);
    if (firstAvailable && firstAvaila
