const container = document.getElementById('content-container');

function renderData() {
    const batch = data["Mission 100 NEET Gujarati 2026"];
    if (!batch) return;

    for (const subject in batch) {
        if (subject === "Telegram Bot" || subject === "Notices") continue;

        let subjectHtml = `<div class="subject-container"><h2 class="subject-header">${subject}</h2>`;
        const chapters = batch[subject];

        for (const chapterName in chapters) {
            const chapterData = chapters[chapterName];
            if (!chapterData) continue;

            subjectHtml += `<div class="chapter-card"><h3>${chapterName}</h3><div class="resource-list">`;

            if (chapterData.videos) {
                chapterData.videos.forEach(vid => {
                    let secureRef = btoa(vid.url);
                    subjectHtml += `<button class="btn btn-video" onclick="playVideo('${secureRef}')">📹 ${vid.name}</button>`;
                });
            }

            const allPdfs = [...(chapterData.notes || []), ...(chapterData.DppNotes || [])];
            allPdfs.forEach(file => {
                subjectHtml += `<a href="${file.url}" target="_blank" class="btn btn-pdf">📝 ${file.name}</a>`;
            });

            subjectHtml += `</div></div>`;
        }
        subjectHtml += `</div>`;
        container.innerHTML += subjectHtml;
    }
}

function playVideo(secureRef) {
    const rawUrl = atob(secureRef);
    const finalUrl = API_BASE + rawUrl + PW_TOKEN;
    
    const frame = document.getElementById('videoIframe');
    const modal = document.getElementById('playerModal');
    
    frame.src = "about:blank"; 
    
    // Reset active speed tab to 1.0x when opening new video
    document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector('.speed-btn').classList.add('active');

    setTimeout(() => {
        frame.src = finalUrl;
        modal.style.display = 'block';
    }, 100);
}

// Function to handle Video Speed Manipulation inside Iframe
function changeSpeed(speedRate, element) {
    const frame = document.getElementById('videoIframe');
    if (!frame || !frame.contentWindow) return;

    // UI update for selected speed
    document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
    element.classList.add('active');

    // standard HTML5 player command over iframe channel
    frame.contentWindow.postMessage(JSON.stringify({
        event: 'command',
        func: 'setPlaybackRate',
        args: [speedRate]
    }), '*');

    // fallback core injection for standalone standard video streams
    frame.contentWindow.postMessage({
        type: 'setSpeed',
        value: speedRate
    }, '*');
}

function closeVideo() {
    document.getElementById('videoIframe').src = "";
    document.getElementById('playerModal').style.display = 'none';
}

renderData();
